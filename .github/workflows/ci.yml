name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -q

      - name: Smoke-train on the public dataset
        run: |
          python scripts/download_data.py
          python scripts/train.py --models logistic_regression --output-dir artifacts/ci
