[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retainiq"
version = "1.0.0"
description = "AI powered customer retention intelligence platform for telecom churn prediction and monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deepak Tripathi" }]
keywords = ["machine-learning", "churn-prediction", "fastapi", "mlops", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules bootstrap sys.path before importing the package.
"src/retainiq/dashboard/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
